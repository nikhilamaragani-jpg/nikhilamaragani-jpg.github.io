name: Build real-data analytics

on:
  push:
    branches: [main]
    paths:
      - "projects/ecommerce-operations-intelligence/**"
      - ".github/workflows/build-ecommerce-analytics.yml"
  workflow_dispatch:

# Only one analytics writer may run at a time.
concurrency:
  group: ecommerce-analytics-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analytics dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Refresh from latest main and build
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python projects/ecommerce-operations-intelligence/analysis/build_analysis.py

      - name: Validate generated output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("projects/ecommerce-operations-intelligence/dashboard/data/summary.json")
          data = json.loads(p.read_text())
          assert data["kpis"]["orders"] > 0
          assert data["kpis"]["revenue"] > 0
          assert len(data["monthly"]) > 0
          assert len(data["categories"]) > 0
          assert len(data["states"]) > 0
          print("Generated analytics validated.")
          PY

      - name: Commit and push generated analytics
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            # Always start the attempt from the newest remote main.
            git fetch origin main
            git reset --hard origin/main

            # Rebuild against exactly that main.
            python projects/ecommerce-operations-intelligence/analysis/build_analysis.py

            git add               projects/ecommerce-operations-intelligence/dashboard/data               projects/ecommerce-operations-intelligence/docs/data-quality.md               projects/ecommerce-operations-intelligence/docs/insights.md

            if git diff --cached --quiet; then
              echo "No generated changes."
              exit 0
            fi

            git commit -m "build: refresh real-data analytics outputs"

            if git push origin HEAD:main; then
              echo "Generated analytics pushed successfully."
              exit 0
            fi

            echo "Main advanced during push; retrying (${attempt}/3)..."
          done

          echo "Could not push generated analytics after 3 attempts."
          exit 1
