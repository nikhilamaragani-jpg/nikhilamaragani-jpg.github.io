name: Build real-data analytics

on:
  push:
    branches: [main]
    paths:
      - "projects/ecommerce-operations-intelligence/**"
      - ".github/workflows/build-ecommerce-analytics.yml"
  workflow_dispatch:

# Prevent two analytics writers from racing to update main.
concurrency:
  group: ecommerce-analytics-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analytics dependencies
        run: python -m pip install --upgrade pip pandas numpy

      - name: Build analytical outputs from real Olist data
        working-directory: projects/ecommerce-operations-intelligence
        run: python analysis/build_analysis.py

      - name: Validate generated output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("projects/ecommerce-operations-intelligence/dashboard/data/summary.json")
          data = json.loads(p.read_text())
          assert data["kpis"]["orders"] > 0
          assert data["kpis"]["revenue"] > 0
          assert len(data["monthly"]) > 0
          assert len(data["categories"]) > 0
          assert len(data["states"]) > 0
          print("Generated analytics validated.")
          PY

      - name: Commit generated analytics safely
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             projects/ecommerce-operations-intelligence/dashboard/data             projects/ecommerce-operations-intelligence/docs/data-quality.md             projects/ecommerce-operations-intelligence/docs/insights.md

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "build: refresh real-data analytics outputs"

          # Main may have advanced while the analysis was running.
          # Rebase the generated commit onto the latest main and retry the push.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Generated analytics pushed successfully."
              exit 0
            fi

            echo "Push race detected; retrying (${attempt}/3)..."
            git rebase --abort || true
            git reset --hard origin/main

            # Re-run generation against the newest main before the next attempt.
            (
              cd projects/ecommerce-operations-intelligence
              python build_analysis.py
            )

            git add               projects/ecommerce-operations-intelligence/dashboard/data               projects/ecommerce-operations-intelligence/docs/data-quality.md               projects/ecommerce-operations-intelligence/docs/insights.md

            if git diff --cached --quiet; then
              echo "No generated changes after refresh."
              exit 0
            fi

            git commit -m "build: refresh real-data analytics outputs"
          done

          echo "Could not push generated analytics after 3 attempts."
          exit 1
